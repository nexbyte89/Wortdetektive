<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3D5AFE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortdetektive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Die Wortdetektive</title>

<style>
@font-face{font-family:'Baloo 2';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Baloo 2';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Lexend';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/lexend-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Lexend';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/lexend-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Lexend';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/lexend-latin-600-normal.woff2) format('woff2')}

/* Layout: Lernpfad im Zickzack wie ein Detektiv-Fahrplan, darunter Lernkarten und Aufgaben in einer schmalen Heftseite (max 560px) */
:root{
  --bg:#F2F7FF; --card:#FFFFFF; --ink:#1B2559; --ink-soft:#56628F; --line:#D3DDF3; --lineatur:#BFD0F2;
  --primary:#3D5AFE; --primary-deep:#2038C9; --on-primary:#FFFFFF;
  --sun:#FFC83D; --sun-deep:#D9A000; --sun-ink:#4A3600;
  --ok:#2FA84F; --ok-bg:#DFF6E5; --ok-deep:#1B7536;
  --bad:#E5484D; --bad-bg:#FFE4E5; --bad-deep:#B3262B;
  --s0:#7BAA2E; --s1:#4A9FC4; --s2:#E8960C; --s3:#EC735A;
  --shadow:0 2px 0 rgba(27,37,89,.08); --onc:#FFFFFF;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Lexend','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F152E; --card:#192146; --ink:#EAF0FF; --ink-soft:#A6B1DD; --line:#2B3767; --lineatur:#2C3A6E;
  --primary:#6F86FF; --primary-deep:#4A62E6; --on-primary:#0F152E;
  --sun:#FFD25E; --sun-deep:#C99400; --sun-ink:#3D2D00;
  --ok:#43C466; --ok-bg:#12351F; --ok-deep:#7BE09A;
  --bad:#FF6B70; --bad-bg:#3A1A20; --bad-deep:#FF9DA1;
  --s0:#A6D05A; --s1:#7CC3E6; --s2:#FFC24A; --s3:#FF9A82; --shadow:0 2px 0 rgba(0,0,0,.35); --onc:#0F152E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F152E; --card:#192146; --ink:#EAF0FF; --ink-soft:#A6B1DD; --line:#2B3767; --lineatur:#2C3A6E;
  --primary:#6F86FF; --primary-deep:#4A62E6; --on-primary:#0F152E;
  --sun:#FFD25E; --sun-deep:#C99400; --sun-ink:#3D2D00;
  --ok:#43C466; --ok-bg:#12351F; --ok-deep:#7BE09A;
  --bad:#FF6B70; --bad-bg:#3A1A20; --bad-deep:#FF9DA1;
  --s0:#A6D05A; --s1:#7CC3E6; --s2:#FFC24A; --s3:#FF9A82; --shadow:0 2px 0 rgba(0,0,0,.35); --onc:#0F152E; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 200px}
.opt:disabled,.tok:disabled{cursor:default;color:inherit;opacity:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px}
.brand svg{width:40px;height:40px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px}
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:8px 6px;font-weight:600;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.hello{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:8px}
.hello svg{width:64px;height:64px;flex:none}
.hello p{font-size:15px;color:var(--ink-soft)}
.hello b{color:var(--ink);font-family:var(--f-display);font-size:19px;display:block}
.banner{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 14px;margin:22px 0 6px;color:var(--onc);font-family:var(--f-display);font-weight:700;font-size:18px}
.banner small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;opacity:.92}
.path{display:flex;flex-direction:column;align-items:center;gap:6px}
.stop{display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateX(var(--dx,0));width:200px;padding-block:6px}
.node{width:78px;height:78px;border-radius:50%;border:0;background:var(--c);color:var(--onc);display:grid;place-items:center;box-shadow:0 6px 0 var(--cd);position:relative;transition:transform .12s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.node svg{width:50px;height:50px}
.node.locked{background:var(--line);box-shadow:0 6px 0 var(--lineatur);color:var(--ink-soft);cursor:not-allowed}
.node.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--sun);animation:ring 1.8s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.07);opacity:.55}}
.stars{display:flex;gap:2px;margin-top:10px;height:20px}
.stars svg{width:20px;height:20px}
.stop .t{font-family:var(--f-display);font-weight:700;font-size:17px;margin-top:2px}
.stop .s{font-size:13px;color:var(--ink-soft);line-height:1.3}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{border:0;border-radius:16px;padding:13px 22px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.3px;text-transform:uppercase;background:var(--primary);color:var(--on-primary);box-shadow:0 5px 0 var(--primary-deep);width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--primary-deep)}
.btn:disabled{background:var(--line);color:var(--ink-soft);box-shadow:0 5px 0 var(--lineatur);cursor:not-allowed}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 5px 0 var(--sun-deep)}
.btn.ghost{background:transparent;color:var(--primary);box-shadow:none;border:2px solid var(--line)}
.btn.sm{width:auto;font-size:15px;padding:8px 14px;box-shadow:0 3px 0 var(--primary-deep)}
.btn.ghost.sm{box-shadow:none}
.lesson-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.x{border:0;background:transparent;color:var(--ink-soft);width:36px;height:36px;border-radius:50%;font-size:26px;line-height:1}
.bar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.hearts{display:flex;gap:3px;align-items:center;font-weight:700;color:var(--bad)}
.hearts svg{width:24px;height:24px}
.hearts .off{opacity:.25}
.q{font-family:var(--f-display);font-weight:700;font-size:24px;margin-bottom:14px}
.wordbox{font-family:var(--f-display);font-weight:600;font-size:36px;text-align:center;padding:16px 8px 12px;border-radius:16px;margin-bottom:16px;
  background:linear-gradient(var(--lineatur),var(--lineatur)) 0 22px/100% 2px no-repeat,linear-gradient(var(--lineatur),var(--lineatur)) 0 calc(100% - 22px)/100% 2px no-repeat,var(--card);border:2px solid var(--line)}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:16px;padding:13px 16px;font-family:var(--f-display);font-weight:600;font-size:26px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 4px 0 var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--card))}
.opt.ok{border-color:var(--ok);box-shadow:0 4px 0 var(--ok);background:var(--ok-bg)}
.opt.no{border-color:var(--bad);box-shadow:0 4px 0 var(--bad);background:var(--bad-bg)}
.opt.sm{font-size:19px;font-family:var(--f-body)}
.inp{width:100%;font-family:var(--f-display);font-weight:600;font-size:32px;text-align:center;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.inp.ok{border-color:var(--ok);background:var(--ok-bg)}.inp.no{border-color:var(--bad);background:var(--bad-bg)}
.sent{display:flex;flex-wrap:wrap;gap:8px;font-size:24px;font-family:var(--f-display);font-weight:600;padding:8px 0 16px}
.tok{border:2px solid transparent;background:transparent;border-bottom:3px dashed var(--lineatur);border-radius:10px;padding:2px 8px;font-family:inherit;font-weight:inherit;font-size:inherit}
.tok[aria-pressed="true"]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--card))}
.tok.ok{border-color:var(--ok);background:var(--ok-bg)}.tok.no{border-color:var(--bad);background:var(--bad-bg)}
.letters{display:flex;justify-content:center;align-items:stretch;flex-wrap:wrap;row-gap:10px;padding:14px 0 18px}
.ltr{font-family:var(--f-display);font-weight:700;font-size:var(--fs,40px);line-height:1;display:flex;align-items:center;padding:8px 1px}
.gap{width:var(--gw,20px);border:0;background:transparent;position:relative;padding:0;border-radius:8px}
.gap::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:0;border-left:2px dashed var(--lineatur);transform:translateX(-50%)}
.gap[aria-pressed="true"]::before{border-left:5px solid var(--primary);border-radius:4px}
.gap.ok::before{border-left:5px solid var(--ok)}.gap.no::before{border-left:5px solid var(--bad)}
.gap.miss::before{border-left:5px dotted var(--ok)}
.hint{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.tipbox{margin-top:10px;border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--sun) 24%,var(--card));border:2px solid var(--sun);font-size:16px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 12px 2px 8px;color:var(--onc);font-weight:600;font-size:14px;background:var(--c)}
.tag svg{width:18px;height:18px}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid var(--line);background:var(--bg);z-index:5}
.fb>div{max-width:560px;margin:0 auto}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{font-size:22px;margin-bottom:2px}
.fb.ok h3{color:var(--ok-deep)}.fb.no h3{color:var(--bad-deep)}
.fb p{font-size:16px;margin-bottom:12px}
.fb.ok .btn{background:var(--ok);box-shadow:0 5px 0 var(--ok-deep);color:var(--onc)}
.fb.no .btn{background:var(--bad);box-shadow:0 5px 0 var(--bad-deep);color:var(--onc)}
.center{text-align:center}
.big-owl{width:150px;height:150px;margin:6px auto 0;display:block}
.learn h2{font-size:28px;margin:8px 0 6px}
.learn .lead{color:var(--ink-soft);margin-bottom:14px}
.ex{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 0}
.ex div{font-family:var(--f-display);font-weight:600;font-size:22px}
.ex small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-soft)}
.ex em{font-style:normal;color:var(--bad)}.ex strong{color:var(--ok-deep)}
.rule{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:2px dashed var(--line)}
.rule:first-of-type{border-top:0}
.rule b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c,var(--primary));color:var(--onc);display:grid;place-items:center;font-family:var(--f-display);font-size:16px}
.big-num{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1}
.res-stars{display:flex;justify-content:center;gap:8px;margin:10px 0}
.res-stars svg{width:54px;height:54px}
.res-stars svg.pop{animation:pop .5s both}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stats .card{padding:10px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:26px}
.stats span{font-size:13px;color:var(--ink-soft)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);z-index:4;
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav>div{max-width:560px;margin:0 auto;display:flex;gap:8px}
.nav button{flex:1;border:0;background:transparent;border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:600;font-size:13px;color:var(--ink-soft)}
.nav button svg{width:28px;height:28px}
.nav button[aria-current="page"]{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--card))}
.cheat h2{font-size:24px;margin:22px 0 8px}
.scard{border-left:10px solid var(--c);}
.scard h3{display:flex;align-items:center;gap:8px;font-size:22px}
.scard h3 svg{width:30px;height:30px;color:var(--c)}
.scard p{margin-top:6px}
.reset{margin-top:26px;text-align:center}
.reset button{background:none;border:0;color:var(--ink-soft);text-decoration:underline;font-size:14px}
@media (max-width:420px){.wordbox{font-size:30px}.opt{font-size:23px}.stop{width:170px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

};
const heart=on=>`<svg viewBox="0 0 24 24" class="${on?'':'off'}"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z" fill="currentColor"/></svg>`;

/* ---------- Strategien (Spickzettel) ---------- */
const STRAT=[
 {n:'Schwingen',a:'Mitsprechen',c:'--s0',i:'sw',t:'Sprich das Wort langsam in Silben und schwinge dazu mit dem Arm. Jede Silbe ist ein Bogen. So hörst du, wo ein Doppelmitlaut oder ck steht.',e:'Son-ne · Kat-ze · ba-cken'},

 h+=`<div class="seg" role="group" aria-label="Klassenstufe"><button data-act="klasse" data-v="3" aria-pressed="${me.k===3}">Klasse 3</button><button data-act="klasse" data-v="4" aria-pressed="${me.k===4}">Klasse 4</button></div>`;
 h+=`<div class="hello">${OWL()}<p><b>Hallo!</b>${msg}</p></div><div class="path">`;
 const DX=[0,46,70,46,0,-46,-70,-46];let n=0;
 const cur=UNITS.findIndex((u,i)=>unlocked(i)&&!(me.stars[u.id]>0));
 GROUPS.forEach((g,gi)=>{
  h+=`<div class="banner" style="background:${sv(g.c)};align-self:stretch"><div>${g.t}<small>${g.s}</small></div></div>`;
  UNITS.forEach((u,i)=>{if(u.g!==gi)return;

 h+=STRAT.map(s=>`<div class="card scard" style="--c:${sv(s.c)}"><h3>${ICO[s.i]}${s.n}</h3><p>${s.t}</p><p style="font-family:var(--f-display);font-weight:600;font-size:19px;margin-top:8px">${s.e}</p></div>`).join('');
 h+=`<div class="card"><h3>Wörter trennen</h3><div class="rule" style="--c:var(--s1)"><b>1</b><span>Schwinge das Wort. Zwischen zwei Bögen darfst du trennen: Ho-se, Ba-na-ne.</span></div><div class="rule" style="--c:var(--s1)"><b>2</b><span>Ein einzelner Mitlaut kommt in die nächste Silbe: Ne-bel, Ru-he.</span></div><div class="rule" style="--c:var(--s1)"><b>3</b><span>ck, ch und sch bleiben zusammen: ba-cken, la-chen, Ta-sche.</span></div><div class="rule" style="--c:var(--s1)"><b>4</b><span>Bei mehreren Mitlauten kommt der letzte in die nächste Silbe: Kat-ze, Fens-ter, Mut-ter.</span></div><div class="rule" style="--c:var(--s1)"><b>5</b><span>Zusammengesetzte Wörter trennst du zuerst zwischen den Wörtern: Haus-tür.</span></div></div>`;
 h+=`<div class="card"><h3>ss oder ß?</h3><p style="margin-top:6px">Kurzer Selbstlaut: <b>ss</b> (Fluss, Wasser). Langer Selbstlaut oder Doppellaut: <b>ß</b> (Fuß, Straße, heiß). Das Bindewort schreibst du <b>dass</b>.</p></div>`;
 h+=`<div class="card"><h3>Knifflige Wörter</h3><p style="margin-top:6px">Bei Fremdwörtern hilft nur <b>Merken</b>: Clown, Computer, Mayonnaise. Griechische Wörter: <b>ph</b> klingt wie f (Physik), <b>th</b> wie t (Theater), <b>rh</b> wie r (Rhythmus), <b>ch</b> wie k (Chor). Manche Wörter dürfen zwei Schreibweisen haben: Jogurt oder Joghurt.</p></div>`;
 h+=`<div class="card"><h3>Groß oder klein?</h3><p style="margin-top:6px">Nomen schreibst du groß. Probe: der, die oder das davor? Verben und Adjektive schreibst du klein.</p></div>`;
 h+=`<div class="card"><h3>Für Eltern und Lehrkräfte</h3><p style="margin-top:6px;font-size:15px;color:var(--ink-soft)">Die vier Strategien gehen auf die FRESCH-Methode (Freiburger Rechtschreibschule) zurück und decken sich mit Mitsprechen, Ableiten und Einprägen aus den Bildungsstandards. Der Bildungsplan Baden-Württemberg setzt auf Rechtschreibstrategien und einen verbindlichen Grundwortschatz. Alle Wörter hier sind eine eigene Auswahl und nach der aktuellen amtlichen Rechtschreibung geschrieben. Falsche Schreibweisen kommen nur als Fehlerbeispiele vor.</p></div></div>`;
 h+=`<p style="text-align:center;font-size:14px;margin:18px 0"><a href="datenschutz.html">Datenschutz</a> · <a href="impressum.html">Impressum</a></p>`;
 h+=`<div class="reset"><button data-act="reset">${resetAsk?'Wirklich alles löschen? Tippe noch einmal.':'Fortschritt zurücksetzen'}</button></div>`;
 return h+nav('cheat');
}

/* ---------- Ergebnis ---------- */
function result(){
 const R=V.r,u=UNITS[V.i];
 let h=`<div class="center">${OWL('big-owl')}`;
 if(R.ok){
  h+=`<h2 style="margin-top:8px;font-size:32px">Fall gelöst!</h2><div class="res-stars">${[0,1,2].map(j=>star(j<R.stars).replace('<svg','<svg style="animation-delay:'+(j*.25)+'s" class="'+(j<R.stars?'pop':'')+'"')).join('')}</div>`;
  h+=`<p style="color:var(--ink-soft)">${R.stars===3?'Fehlerfrei. Das war Detektivarbeit!':R.stars===2?'Sehr gut! Ein Fehler hat sich versteckt.':'Geschafft! Beim nächsten Mal klappt noch mehr.'}</p>`;
  h+=`<div class="stats"><div class="card"><b>${R.good} von ${R.n}</b><span>richtig</span></div><div class="card"><b>+${R.xp}</b><span>Punkte</span></div></div>`;
  h+=`<div class="stack"><button class="btn" data-act="home">Weiter</button><button class="btn ghost" data-act="start">Noch einmal üben</button></div>`;
 }else{
  h+=`<h2 style="margin-top:8px;font-size:30px">Fast geschafft!</h2><p style="color:var(--ink-soft);margin:8px 0 18px">Die Herzen sind leer. Lies die Lernkarte noch einmal und versuche es dann erneut.</p>`;
  h+=`<div class="stack"><button class="btn sun" data-act="start">Noch einmal versuchen</button><button class="btn ghost" data-act="learn">Lernkarte ansehen</button><button class="btn ghost" data-act="home">Zum Lernpfad</button></div>`;
 }
 return h+'</div>';
}
/* ---------- Trennen: Hilfen ---------- */
const COMP=new Set(['Haus|tür','Eis|bär','Fuß|ball','Spiel|zeug','Fahr|rad','Blei|stift','Spiel|platz','Früh|stück','Zahn|bürs|te','Schul|ran|zen','Re|gen|bo|gen','Kin|der|gar|ten','Son|nen|blu|me','Ta|schen|lam|pe','Wasch|ma|schi|ne','Eich|hörn|chen','Haus|auf|ga|be','Wohn|zim|mer','Kü|chen|tisch','Spa|zier|gang','Schul|hof','Bü|cher|re|gal','Ei|sen|bahn','Hun|de|hüt|te','Ap|fel|baum','Kar|tof|fel|sup|pe','Mu|sik|un|ter|richt','Ge|burts|tag','Scho|ko|la|den|ku|chen','Pup|pen|haus','Brief|kas|ten','Hams|ter|kä|fig','Win|ter|müt|ze','Tisch|ten|nis','Zu|cker|rü|be']);
const VOW=/[aeiouäöüy]$/i;
function parseP(w){const parts=w.split('|'),chars=Array.from(parts.join('')),cuts=new Set();let n=0;parts.slice(0,-1).forEach(p=>{n+=Array.from(p).length;cuts.add(n-1)});return{parts,chars,cuts}}
function hyHints(w){
 const {parts}=parseP(w);
 if(parts.length===1)return 'Dieses Wort hat nur eine Silbe. Das trennst du nicht.';
 if(COMP.has(w))return 'Zusammengesetzte Wörter trennst du zuerst zwischen den Wortbausteinen.';
 const hs=[];
 for(let i=0;i<parts.length-1;i++){const l=parts[i],r=parts[i+1];
  if(/^(ck|ch|sch)/i.test(r))hs.push('ck, ch und sch bleiben zusammen.');
  else if(/^h/.test(r)&&VOW.test(l))hs.push('Das h gehört zur nächsten Silbe.');
  else if(l.slice(-1)===r[0])hs.push('Doppelte Mitlaute trennst du in der Mitte.');
  else if(/s$/.test(l)&&/^t/.test(r))hs.push('Das st darfst du trennen.');
  else if(/t$/.test(l)&&/^z/.test(r))hs.push('Das tz darfst du trennen.');
  else if(VOW.test(l))hs.push('Ein einzelner Mitlaut kommt in die nächste Silbe.');
  else hs.push('Bei mehreren Mitlauten kommt der letzte in die nächste Silbe.');
 }
 return [...new Set(hs)].slice(0,2).join(' ');
}
const strip=t=>t.replace(/[.,!?;:]+$/,'');
const wrongIdx=it=>it.s.split(' ').findIndex(t=>strip(t)===it.w);
const itemKey=it=>it.t==='s'||it.t==='p'?it.w:it.t==='m'?it.v[0]:it.a;

/* ---------- Lektion ---------- */
/* Prüfungen: Aufgabentypen abwechselnd mischen, in den schweren Prüfungen wird aus Auswählen ein Selbst-Tippen */
function pickExam(u){
 const E=EXAM[u.id];let pool=[];
 E.from.forEach(id=>ITEMS[id].forEach(it=>{if(it.k===me.k)pool.push(it)}));
 pool=shuffle(pool).map(it=>E.typed&&it.t==='c'?{t:'t',w:it.o[1+Math.floor(Math.random()*(it.o.length-1))],a:it.a,k:it.k,u:it.u}:it).filter(it=>E.types.includes(it.t));
 const lists=E.types.map(ty=>pool.filter(it=>it.t===ty)),seen=new Set(),out=[];
 for(let g=0;g<400&&out.length<E.n;g++){let any=false;
  for(const L of lists){while(L.length){const it=L.shift(),k=itemKey(it);if(seen.has(k))continue;seen.add(k);out.push({...it});any=true;break}if(out.length>=E.n)break}
  if(!any)break}
 return shuffle(out);
}
function pick(u){
 if(EXAM[u.id])return pickExam(u);
 const N=20,pool=ITEMS[u.id];
 const list=shuffle(pool.filter(x=>x.k===me.k));
 const seen=new Set(),out=[];
 for(const it of list){const k=itemKey(it);if(seen.has(k))continue;seen.add(k);out.push({...it});if(out.length===N)break}
 if(out.length<N)for(const it of list){if(out.length>=N)break;if(!out.some(o=>o===it||(o.t===it.t&&itemKey(o)===itemKey(it))))out.push({...it})}
 return shuffle(out);
}
const newS=it=>({stage:1,msel:new Set(),sel:null,tok:null,opt:null,val:'',tip:false,checked:false,ok:false,note:'',cuts:new Set(),opts:it.t==='c'||it.t==='f'?shuffle(it.o):it.t==='m'?shuffle([...it.v,...it.i]):[]});
function startQuiz(i){const q=pick(UNITS[i]);Q={i,q,pos:0,hearts:3,good:0,n:q.length,s:newS(q[0])};V={n:'quiz'};render(true)}
function check(){
 const it=Q.q[Q.pos],s=Q.s;if(s.checked)return;
 let ok=false;
 if(it.t==='c'||it.t==='s')ok=s.sel===it.a;
 else if(it.t==='t'){const v=s.val.trim();ok=v===it.a;if(!ok&&v.toLowerCase()===it.a.toLowerCase())s.note='Achte auf Groß- und Kleinschreibung. '}
 else if(it.t==='f'){
  if(s.stage===1&&s.tok===wrongIdx(it)){s.stage=2;beep(true);render(false);return}
  ok=s.stage===2&&s.opt===it.a}
 else if(it.t==='m')ok=it.v.length===s.msel.size&&it.v.every(x=>s.msel.has(x));
 else{const {cuts}=parseP(it.w);ok=cuts.size===s.cuts.size&&[...cuts].every(c=>s.cuts.has(c))}
 s.checked=true;s.ok=ok;
 if(ok)Q.good++;else{Q.hearts--;if(!it._rq)Q.q.push({...it,_rq:1})}
 beep(ok);render(false);
}
function next(){
 if(Q.hearts<=0)return finish(false);
 Q.pos++;
 if(Q.pos>=Q.q.length)return finish(true);
 Q.s=newS(Q.q[Q.pos]);render(true);
}
function finish(ok){
 const u=UNITS[Q.i],stars=Q.hearts;let xp=0;
 if(ok){xp=Q.good*10+stars*5;me.xp+=xp;me.stars[u.id]=Math.max(me.stars[u.id]||0,stars);
  const t=dk(new Date());if(me.last!==t){const y=new Date();y.setDate(y.getDate()-1);me.streak=me.last===dk(y)?me.streak+1:1;me.last=t}save()}
 V={n:'result',i:Q.i,r:{ok,stars,xp,good:Q.good,n:Q.n}};render(true);
}
function fbText(it){
 if(it.t==='c'||it.t==='t')return{ans:it.a,ex:W[it.a]||''};
 if(it.t==='f')return{ans:`${it.w} → ${it.a}`,ex:it.e||W[it.a]||''};
 if(it.t==='s')return{ans:STRAT[it.a].n,ex:W[it.w]||''};
 if(it.t==='m')return{ans:it.v.join(' und '),ex:it.e||'Fremdwörter dürfen oft auch eingedeutscht geschrieben werden. Alle anderen Schreibweisen sind Fehler.'};
 return{ans:parseP(it.w).parts.join('-'),ex:hyHints(it.w)};
}
const PRAISE=['Richtig!','Super!','Stark!','Genau!','Gut erkannt!'];
function body(it,s){
 const c=s.checked,dis=c?'disabled':'';let h='';
 if(it.t==='c'){
  h+=`<div class="q">Wie schreibt man das Wort richtig?</div><div class="opts">`+s.opts.map(o=>`<button class="opt ${c?(o===it.a?'ok':o===s.sel?'no':''):''}" data-act="sel" data-v="${esc(o)}" aria-pressed="${s.sel===o}" ${dis}>${esc(o)}</button>`).join('')+`</div>`;
 }else if(it.t==='t'){
  h+=`<div class="q">Hier steckt ein Fehler. Schreibe das Wort richtig.</div><div class="wordbox">${esc(it.w)}</div><input id="ans" class="inp ${c?(s.ok?'ok':'no'):''}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Richtige Schreibweise" value="${esc(s.val)}" ${c?'readonly':''}>`;
 }else if(it.t==='f'){
  const wi=wrongIdx(it);
  h+=`<div class="q">${s.stage===2?'Gefunden! Wie schreibt man das Wort richtig?':'Finde den Fehler. Tippe auf das falsche Wort.'}</div><div class="sent">`+it.s.split(' ').map((t,j)=>`<button class="tok ${c||s.stage===2?(j===wi?'ok':j===s.tok?'no':''):''}" data-act="tok" data-v="${j}" aria-pressed="${s.tok===j}" ${dis||s.stage===2?'disabled':''}>${esc(t)}</button>`).join('')+`</div>`+(s.stage===2?`<div class="q" style="font-size:19px">So wird das Wort richtig geschrieben:</div><div class="opts">`+s.opts.map(o=>`<button class="opt sm ${c?(o===it.a?'ok':o===s.opt?'no':''):''}" data-act="opt" data-v="${esc(o)}" aria-pressed="${s.opt===o}" ${dis}>${esc(o)}</button>`).join('')+`</div>`:'');
 }else if(it.t==='m'){
  h+=`<div class="q">Welche Schreibweisen sind erlaubt? Tippe alle richtigen an.</div><div class="opts">`+s.opts.map(o=>`<button class="opt ${c?(it.v.includes(o)?'ok':s.msel.has(o)?'no':''):''}" data-act="mul" data-v="${esc(o)}" aria-pressed="${s.msel.has(o)}" ${dis}>${esc(o)}</button>`).join('')+`</div>`;
 }else if(it.t==='s'){
  h+=`<div class="q">Welche Strategie hilft dir bei diesem Wort?</div><div class="wordbox">${esc(it.w)}</div><div class="opts">`+STRAT.slice(0,4).map((x,j)=>`<button class="opt sm ${c?(j===it.a?'ok':j===s.sel?'no':''):''}" data-act="sel" data-v="${j}" aria-pressed="${s.sel===j}" ${dis}>${tag(j)}</button>`).join('')+`</div>`;
 }else{
  const {chars,cuts}=parseP(it.w),L=chars.length,fs=L<=7?40:L<=10?34:L<=12?28:24,gw=L<=7?20:L<=10?16:L<=12?12:10;
  let g='';
  chars.forEach((ch,j)=>{g+=`<span class="ltr">${esc(ch)}</span>`;
   if(j<L-1){const on=s.cuts.has(j),k=c?(on&&cuts.has(j)?'ok':on?'no':cuts.has(j)?'miss':''):'';
    g+=`<button class="gap ${k}" data-act="cut" data-v="${j}" aria-pressed="${on}" aria-label="Trennstelle nach Buchstabe ${j+1}" ${dis}></button>`}});
  h+=`<div class="q">Wo darfst du das Wort trennen?</div><p style="color:var(--ink-soft);font-size:15px">Tippe zwischen die Buchstaben. Kann man das Wort nicht trennen, tippe gleich auf Prüfen.</p><div class="letters" style="--fs:${fs}px;--gw:${gw}px">${g}</div>`;
 }
 if(!c){const u=UNITS.find(x=>x.id===it.u)||UNITS[Q.i];
  h+=`<div class="hint"><button class="btn ghost sm" data-act="tip">${s.tip?'Tipp ausblenden':'Tipp'}</button></div>`;
  if(s.tip)h+=`<div class="tipbox">${u.st>=0?tag(u.st)+'<br>':''}${esc(u.tip)}</div>`}
 return h;
}
function foot(it,s){
 if(!s.checked){
  const can=it.t==='c'||it.t==='s'?s.sel!==null:it.t==='t'?s.val.trim().length>0:it.t==='f'?(s.stage===2?s.opt!==null:s.tok!==null):it.t==='m'?s.msel.size>0:true;
  return `<div class="fb"><div><button class="btn" id="chk" data-act="check" ${can?'':'disabled'}>Prüfen</button></div></div>`;
 }
 const {ans,ex}=fbText(it);
 const pre=it.t==='f'&&s.tok!==wrongIdx(it)?`Der Fehler steckt in „${esc(it.w)}“. `:'';
 const msg=s.ok?`<h3>${PRAISE[Q.pos%PRAISE.length]}</h3><p>${esc(ex)}</p>`:`<h3>Nicht ganz.</h3><p>${esc(s.note)}${pre}Richtig: <b>${esc(ans)}</b>. ${esc(ex)}</p>`;
 return `<div class="fb ${s.ok?'ok':'no'}" role="status"><div>${msg}<button class="btn" data-act="next">${Q.hearts<=0?'Weiter':'Weiter'}</button></div></div>`;
}
function quiz(){
 const it=Q.q[Q.pos],s=Q.s,pct=Math.min(100,Math.round(Q.good/Q.n*100));
 return `<div class="lesson-top"><button class="x" data-act="home" aria-label="Lektion beenden">×</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><div class="hearts" role="img" aria-label="${Q.hearts} von 3 Herzen">${[0,1,2].map(i=>heart(i<Q.hearts)).join('')}</div></div>`+body(it,s)+foot(it,s);
}

/* ---------- Anzeige & Ereignisse ---------- */
function render(top){
 app.innerHTML=V.n==='home'?(V.tab==='cheat'?cheat():home()):V.n==='learn'?learn():V.n==='quiz'?quiz():result();
 if(top)window.scrollTo(0,0);
 if(V.n==='quiz'&&!Q.s.checked&&Q.q[Q.pos].t==='t'){const a=document.getElementById('ans');if(a)a.focus({preventScroll:true})}
}
let tm;
function toast(m){let t=document.getElementById('toast');
 if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:15px;z-index:20;max-width:90vw;text-align:center';document.body.appendChild(t)}
 t.textContent=m;t.hidden=false;clearTimeout(tm);tm=setTimeout(()=>{t.hidden=true},2200);
}
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.dataset.act,v=b.dataset.v,inQ=V.n==='quiz'&&Q,it=inQ?Q.q[Q.pos]:null;
 if(inQ&&Q.s.checked&&a!=='next'&&a!=='home')return;
 switch(a){
  case 'klasse':me.k=Number(v);save();render(false);break;
  case 'snd':me.snd=!me.snd;save();render(false);break;
  case 'tab':V={n:'home',tab:v};resetAsk=false;render(true);break;
  case 'home':V={n:'home',tab:'path'};Q=null;render(true);break;
  case 'unit':{const i=Number(b.dataset.i);if(!unlocked(i)){toast('Löse zuerst den Fall davor.');break}V={n:'learn',i};render(true);break}
  case 'learn':V={n:'learn',i:V.i};render(true);break;
  case 'start':startQuiz(V.i);break;
  case 'sel':Q.s.sel=it.t==='s'?Number(v):v;render(false);break;
  case 'tok':Q.s.tok=Number(v);render(false);break;
  case 'opt':Q.s.opt=v;render(false);break;
  case 'mul':Q.s.msel.has(v)?Q.s.msel.delete(v):Q.s.msel.add(v);render(false);break;
  case 'cut':{const j=Number(v);Q.s.cuts.has(j)?Q.s.cuts.delete(j):Q.s.cuts.add(j);render(false);break}
  case 'tip':Q.s.tip=!Q.s.tip;render(false);break;
  case 'check':check();break;
  case 'next':next();break;
  case 'reset':if(!resetAsk){resetAsk=true;render(false)}else{Object.assign(me,{streak:0,last:'',sb:{3:{stars:{},xp:0},4:{stars:{},xp:0}}});save();resetAsk=false;V={n:'home',tab:'path'};render(true)}break;
 }
});
app.addEventListener('input',e=>{if(e.target.id==='ans'&&Q){Q.s.val=e.target.value;const c=document.getElementById('chk');if(c)c.disabled=!e.target.value.trim()}});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||V.n!=='quiz'||!Q||e.target.tagName==='BUTTON')return;
 if(Q.s.checked){e.preventDefault();next()}
 else if(e.target.id==='ans'&&Q.s.val.trim()){e.preventDefault();check()}
});
/* Serie prüfen: Ist der letzte Lerntag älter als gestern, beginnt sie neu. */
(function(){const t=new Date(),y=new Date();y.setDate(y.getDate()-1);if(me.last&&me.last!==dk(t)&&me.last!==dk(y))me.streak=0})();
render(true);
/*JS*/
</script>
